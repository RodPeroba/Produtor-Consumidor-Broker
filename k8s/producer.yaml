apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer-deployment
  namespace: factory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
        - name: producer
          image: rodperoba/factory-producer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: producer
  namespace: factory
spec:
  type: NodePort
  selector:
    app: producer
  ports:
    - port: 5000
      targetPort: 5000